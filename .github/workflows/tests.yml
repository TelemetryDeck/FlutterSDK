name: Test and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Apple build & test
    runs-on: macos-26
    # Swift Package Manager derives the plugin's package identity from the checkout
    # directory name, which must match the package name `telemetrydecksdk`.
    defaults:
      run:
        working-directory: telemetrydecksdk
    steps:
      - name: Repository checkout
        uses: actions/checkout@v5
        with:
          path: telemetrydecksdk
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5.0"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build
        run: |
          cd example
          flutter build ios --release --no-codesign
          flutter build macos
      - name: Test macOS
        run: make test-macos
        # todo: add iOS testing (with code signing enabled)

  android:
    name: Android build, lint & test
    runs-on: macos-26
    steps:
      - name: Repository checkout
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install dependencies
        run: flutter pub get
      - name: Build
        run: |
          cd example
          flutter build apk
      - name: Lint
        run: make checklint
      - name: Test Android
        run: make test-android
